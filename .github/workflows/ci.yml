name: Django CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_gaming_shop
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-django

    - name: Run Django Checks & Migrations
      working-directory: ./backend
      env:
        SECRET_KEY: django-insecure-test-key-minimum-32-chars-long
        DEBUG: True
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_gaming_shop
      run: |
        python manage.py check
        python manage.py migrate

    - name: Run Tests
      working-directory: ./backend
      env:
        SECRET_KEY: django-insecure-test-key-minimum-32-chars-long
        DEBUG: True
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_gaming_shop
      run: |
        pytest
