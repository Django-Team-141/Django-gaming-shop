version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: gaming_shop_db
    environment:
      POSTGRES_DB: gaming_shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d gaming_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gaming_shop_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-portfolio-dev-key-change-me-in-production-32chars
      - DATABASE_URL=postgres://shop_user:secretpassword@db:5432/gaming_shop
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      - USER_PRODUCTS_AUTO_APPROVE=False
      - MAX_PRODUCTS_PER_USER=50
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backend_media: