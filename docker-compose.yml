version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gaming_shop_db
    environment:
      POSTGRES_DB: gaming_shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: gaming_shop_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-portfolio-super-secure-key-32chars
      - DATABASE_URL=postgres://shop_user:secretpassword@db:5432/gaming_shop
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - db

volumes:
  postgres_data:
